apiVersion: v1
kind: ServiceAccount
metadata:
  name: predictor-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: predictor-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: predictor-rolebinding
subjects:
- kind: ServiceAccount
  name: predictor-sa
roleRef:
  kind: Role
  name: predictor-role
  apiGroup: rbac.authorization.k8s.io
