apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: predictops-demo
  template:
    metadata:
      labels:
        app: predictops-demo
    spec:
      containers:
      - name: predictops-demo
        image: predictops-demo:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: predictops-demo-service
spec:
  type: NodePort
  selector:
    app: predictops-demo
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
